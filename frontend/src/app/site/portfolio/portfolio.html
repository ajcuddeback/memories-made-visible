<section class="container page">
  <h1 class="page-title">Portfolio</h1>
  <p class="lede intro">A selection of recent sessions from across Polk County.</p>
  <div class="filters" role="group" aria-label="Filter by session type">
    @for (f of filters; track f.key) {
      <button type="button" class="btn filter" [class.btn-primary]="filter() === f.key" [class.btn-secondary]="filter() !== f.key"
              [attr.aria-pressed]="filter() === f.key" (click)="filter.set(f.key)">{{ f.label }}</button>
    }
  </div>
  <div class="masonry">
    @for (it of items(); track it.id) {
      <figure class="item">
        <div class="frame washed" [style.aspect-ratio]="it.ratio">
          <app-photo-slot [slot]="'pf-' + it.id" [placeholder]="it.cat + ' photo'" [alt]="it.cat + ' session'" />
        </div>
        <figcaption class="caption">{{ it.cat }}</figcaption>
      </figure>
    }
  </div>
</section>

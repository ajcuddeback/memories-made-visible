<form class="start" (submit)="$event.preventDefault(); add()">
  <label class="field field--sm start-field">Start a gallery for a completed session
    <select class="input md" [value]="newGal() ?? ''" (change)="pick($event)">
      <option value="">Choose a session…</option>
      @for (o of options(); track o.id) { <option [value]="o.id">{{ o.label }}</option> }
    </select>
  </label>
  <button type="submit" class="btn btn-primary start-btn" [disabled]="newGal() == null">Create gallery</button>
</form>

@if (rows().length === 0) { <p class="empty">No galleries yet — approve a session, then start its gallery here once it's been shot.</p> }

<div class="list">
  @for (g of rows(); track g.id) {
    <article class="gal">
      <div class="gal-main">
        <h3 class="gal-client">{{ g.client }}</h3>
        <div class="gal-meta">{{ g.session }} · {{ g.date }}</div>
      </div>
      <div class="gal-progress">
        <div class="steps">
          @for (sp of g.steps; track sp.label) {
            <div>
              <div class="step-bar" [class.is-done]="sp.done" [class.is-delivered]="sp.done && sp.delivered"></div>
              <div class="step-label" [class.is-current]="sp.current">{{ sp.label }}</div>
            </div>
          }
        </div>
      </div>
      <div class="gal-actions">
        <button type="button" class="btn btn-secondary act" [disabled]="g.backOff" (click)="back(g.id, g.stage)">Back</button>
        <button type="button" class="btn btn-primary act" [disabled]="g.nextOff" (click)="next(g.id, g.stage)">{{ g.nextLabel }}</button>
      </div>
    </article>
  }
</div>

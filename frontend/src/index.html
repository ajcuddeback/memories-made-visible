    <script>
      // Start the page's API requests before the app bundle has downloaded, so data arrives in parallel with
      // the JavaScript instead of after it (HTML → JS → API becomes HTML → JS ∥ API). The photo map also
      // preloads this page's hero image. The app picks up these promises (SiteDataService) instead of fetching twice.
      (function () {
        try {
          var path = location.pathname.replace(/\/+$/, '') || '/';
          if (path.indexOf('/studio') === 0) return;
          var get = function (url, fb) { return fetch(url, { priority: 'high' }).then(function (r) { return r.ok ? r.json() : fb; }).catch(function () { return fb; }); };
          var hero = { '/': 'home-hero', '/about': 'about-erica', '/events': 'events-set-1' }[path];
          var sizes = { '/': '(max-width: 919px) calc(100vw - 80px), min(560px, 45vw)', '/about': '(max-width: 819px) 100vw, 40vw', '/events': '(max-width: 819px) 100vw, 50vw' };
          var early = {
            pricing: get('/api/pricing', null),
            contact: get('/api/site/contact', null),
            photos: get('/api/photos', {}).then(function (map) {
              var p = hero && map && map[hero];
              if (p && p.src) {
                var l = document.createElement('link');
                l.rel = 'preload'; l.as = 'image'; l.href = p.src; l.fetchPriority = 'high';
                if (p.srcset) { l.imageSrcset = p.srcset; l.imageSizes = sizes[path]; }
                document.head.appendChild(l);
              }
              return map || {};
            })
          };
          if (path === '/events') early.upcoming = get('/api/events/upcoming', []);
          window.__mmvEarly = early;
        } catch (e) {}
      })();
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('mmv-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Memories Made Visible Photography</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Memories Made Visible is a family-run photography studio serving Polk County, Florida — weddings, families, couples, maternity and newborn, seniors and events." />
    <meta name="theme-color" content="#0f1012" />
    <link rel="icon" type="image/png" href="images/logo.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('mmv-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

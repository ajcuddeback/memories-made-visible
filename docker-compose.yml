# Local development dependencies. Start with: docker compose up -d
#   Postgres  → localhost:5432  (mmv / mmv)
#   MinIO     → localhost:9000  (S3 API), console at localhost:9001  (minio / minio123)
#   Mailpit   → localhost:1025  (SMTP), inbox UI at localhost:8025
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmv
      POSTGRES_USER: mmv
      POSTGRES_PASSWORD: mmv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmv -d mmv"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the photo bucket and makes it publicly readable, like the production bucket/CDN.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123 >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/mmv-photos;
      mc anonymous set download local/mmv-photos;
      echo 'mmv-photos bucket ready';
      "

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:

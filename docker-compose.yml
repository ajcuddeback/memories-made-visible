# Local development dependencies. Start with: docker compose up -d
#   Postgres   → localhost:5432  (mmv / mmv)
#   SeaweedFS  → localhost:8333  (S3 API; any credentials), file browser at localhost:8888
#   Mailpit    → localhost:1025  (SMTP), inbox UI at localhost:8025
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmv
      POSTGRES_USER: mmv
      POSTGRES_PASSWORD: mmv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmv -d mmv"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for S3: SeaweedFS (Apache-2.0, on Docker Hub, no license token).
  # With no identities configured it accepts any credentials and anonymous reads,
  # which is exactly what the dev profile's public photo URLs need.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -s3.port=8333 -filer.port=8888 -master.volumeSizeLimitMB=256
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer UI — browse uploads at http://localhost:8888/buckets/mmv-photos/
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the photo bucket once the S3 API answers, then exits.
  s3-init:
    image: curlimages/curl:latest
    depends_on:
      s3:
        condition: service_healthy
    command: >
      sh -c "until curl -sf -X PUT http://s3:8333/mmv-photos >/dev/null; do sleep 1; done;
      echo 'mmv-photos bucket ready'"

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  s3data:

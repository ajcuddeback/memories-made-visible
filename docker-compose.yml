# Local development dependencies. Start with: docker compose up -d
#   Postgres   → localhost:5432  (mmv / mmv)
#   LocalStack → localhost:4566  (S3 API; credentials test / test)
#   Mailpit    → localhost:1025  (SMTP), inbox UI at localhost:8025
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmv
      POSTGRES_USER: mmv
      POSTGRES_PASSWORD: mmv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmv -d mmv"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for S3 (LocalStack community edition). The backend's dev profile
  # points at it; nothing here is used in production.
  s3:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
      PERSISTENCE: 1
    ports:
      - "4566:4566"
    volumes:
      - s3data:/var/lib/localstack
      - ./docker/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  s3data:

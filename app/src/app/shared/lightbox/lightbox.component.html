@if (isOpen) {
  <div class="lightbox-overlay" role="dialog" aria-modal="true" (click)="onOverlayClick($event)" (keydown)="handleKey($event)">
  <button class="lb-close" (click)="$event.stopPropagation(); close()" aria-label="Close">✕</button>
  <button class="lb-prev" (click)="$event.stopPropagation(); prev()" aria-label="Previous">‹</button>
  <div class="lb-content" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      <img [src]="photos[openIndex!].url" [alt]="photos[openIndex!].alt || photos[openIndex!].title" />
      <div class="lb-caption">{{ photos[openIndex!].title }}</div>
    </div>
  <button class="lb-next" (click)="$event.stopPropagation(); next()" aria-label="Next">›</button>
  </div>
}

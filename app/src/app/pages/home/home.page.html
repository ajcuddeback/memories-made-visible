<main>
  <app-hero
    title="Memories Made Visible"
    subtitle="Professional photography for life's important moments"
    ctaText="View Portfolio"
    ctaLink="/portfolio"
  ></app-hero>

  <section class="featured" >
    <h2>Featured Work</h2>
    <gallery-grid [photos]="photos" (photoClick)="open($event)"></gallery-grid>
    <app-lightbox [photos]="photos" [(openIndex)]="openIndex"></app-lightbox>
  </section>

  <app-testimonials [testimonials]="testimonials"></app-testimonials>
</main>

# Production-style stack: nginx (site + /api proxy) → Spring Boot → Postgres.
# Photos go to real S3; email goes to your SMTP provider. Configure via .env (see .env.example).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Put TLS termination (Caddy, Traefik, an ALB, Cloudflare) in front of port 80.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mmv}
      POSTGRES_USER: ${POSTGRES_USER:-mmv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmv} -d ${POSTGRES_DB:-mmv}"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-mmv-backend:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mmv}
      DATABASE_USERNAME: ${POSTGRES_USER:-mmv}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/New_York}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@memoriesmadevisible.com}
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      CONTACT_INSTAGRAM: ${CONTACT_INSTAGRAM:-}
      ADMIN_OWNER: ${ADMIN_OWNER:-Austin}
    expose:
      - "8080"
    ports:
      # Health + Prometheus metrics, loopback only: Prometheus on this box scrapes 127.0.0.1:9091/actuator/prometheus.
      - "127.0.0.1:${MANAGEMENT_PORT:-9091}:9091"

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-mmv-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${HTTP_PORT:-80}:8080"

  # Optional: self-hosted, S3-compatible photo storage (SeaweedFS, Apache-2.0, on Docker Hub) instead of AWS S3.
  #   docker compose -f docker-compose.prod.yml --profile storage up -d
  # Writes need the backend's AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (any values you choose); reads are anonymous
  # so nginx can serve /photos/ straight from it. In .env: S3_ENDPOINT=http://storage:8333  S3_PATH_STYLE=true
  # S3_PUBLIC_BASE_URL=https://www.memoriesmadevisible.com/photos/mmv-photos (see docs/DEPLOYMENT.md → Photos without AWS).
  storage:
    image: chrislusf/seaweedfs:latest
    profiles: ["storage"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities":[
          {"name":"backend","credentials":[{"accessKey":"${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}","secretKey":"${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}"}],
           "actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"anonymous","actions":["Read"]}
        ]}
        JSON
        exec weed server -s3 -dir=/data -ip.bind=0.0.0.0 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    volumes:
      - photos:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  # Creates the photo bucket once SeaweedFS is up, then exits.
  storage-init:
    image: chrislusf/seaweedfs:latest
    profiles: ["storage"]
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until echo "s3.bucket.create -name ${S3_BUCKET:-mmv-photos}" | weed shell -master=storage:9333 2>&1 | grep -qv "connect"; do sleep 2; done
        echo "photo bucket ${S3_BUCKET:-mmv-photos} ready"

volumes:
  pgdata:
  photos:

# Local development: docker compose up → Postgres :5432, SeaweedFS S3 :8333, Mailpit :1025/:8025
spring:
  jpa:
    show-sql: false

app:
  seed-demo-data: true
  admin:
    users:
      - name: Erica
        role: Lead photographer
        password: ${ADMIN_ERICA_PASSWORD:erica-dev}
      - name: Austin
        role: Second photographer & operations
        password: ${ADMIN_AUSTIN_PASSWORD:austin-dev}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  cors:
    # ng serve (4200) and the prerendered-build static server (4300), on either loopback name
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200,http://localhost:4300,http://127.0.0.1:4300
  notifications:
    send-customer-confirmation: true
  s3:
    bucket: ${S3_BUCKET:mmv-photos}
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    path-style-access: true
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:8333/mmv-photos}

logging:
  level:
    com.memoriesmadevisible: DEBUG

spring:
  application:
    name: mmv-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mmv}
    username: ${DATABASE_USERNAME:mmv}
    password: ${DATABASE_PASSWORD:mmv}
    hikari:
      # Small, polite pool: managed Postgres tiers cap connections (Neon free ≈ 100, DO basic ≈ 22),
      # and this app never needs more than a handful.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      # Scale-to-zero providers (Neon) take ~1s to wake; give the first connection time.
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  compression:
    enabled: true

management:
  # Health and Prometheus metrics live on their own port so nginx never exposes them. Prometheus on the same box
  # scrapes http://127.0.0.1:9091/actuator/prometheus (see docs/DEPLOYMENT.md → Metrics).
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        # Also answer /livez and /readyz on the API port itself, for the container healthcheck and hosts that
        # only reach one port (Railway). Readiness includes the database.
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: mmv
    distribution:
      # Histogram buckets so Grafana can plot p50/p95/p99 request latency.
      percentiles-histogram:
        http.server.requests: true
  health:
    # A slow SMTP server shouldn't take the whole app out of the load balancer.
    mail:
      enabled: false

app:
  seed-demo-data: false
  # The studio's time zone: "today", booking notice and upcoming pop-ups are judged in it, not the server's.
  time-zone: ${APP_TIME_ZONE:America/New_York}
  admin:
    # The one OWNER account. The rest start as ADMIN; more people are added from Studio → Team.
    owner: ${ADMIN_OWNER:Austin}
    # First accounts, created once on first boot (never overwritten — people change passwords in the studio).
    users:
      - name: Erica
        role: Lead photographer
        password: ${ADMIN_ERICA_PASSWORD:}
        email: ${ADMIN_ERICA_EMAIL:}
      - name: Austin
        role: Second photographer & operations
        password: ${ADMIN_AUSTIN_PASSWORD:}
        email: ${ADMIN_AUSTIN_EMAIL:}
  jwt:
    # At least 32 characters. Generate one with: openssl rand -base64 48
    secret: ${APP_JWT_SECRET:}
    ttl-hours: 12
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  notifications:
    # Internal sender for studio notifications
    from: ${NOTIFY_FROM:admin@memoriesmadevisible.com}
    # The inbox that gets every new booking request (comma-separate for more than one)
    to: ${NOTIFY_TO:bookings@memoriesmadevisible.com}
    # Optional: a different From for customer acknowledgements. Must be an alias of the SMTP
    # mailbox or the provider will reject it. Blank = same as `from`; replies go to `to` regardless.
    customer-from: ${NOTIFY_CUSTOMER_FROM:hello@memoriesmadevisible.com}
    send-customer-confirmation: ${NOTIFY_CUSTOMER:false}
    site-url: ${APP_SITE_URL:http://localhost:4200}
  # Who leads a session when the customer didn't (or couldn't) choose a photographer.
  default-photographer: ${DEFAULT_PHOTOGRAPHER:Erica}
  # Direct contact details shown on the site (booking page, about page, footer).
  contact:
    email: ${CONTACT_EMAIL:hello@memoriesmadevisible.com}
    phone: ${CONTACT_PHONE:}
    instagram: ${CONTACT_INSTAGRAM:}
    location: ${CONTACT_LOCATION:Winter Haven, FL · Serving all of Polk County}
  s3:
    bucket: ${S3_BUCKET:mmv-photos}
    region: ${AWS_REGION:us-east-1}
    # Leave blank for real AWS; the dev profile points this at SeaweedFS.
    endpoint: ${S3_ENDPOINT:}
    path-style-access: ${S3_PATH_STYLE:false}
    # Optional CloudFront / bucket-website base. Blank → presigned GET URLs.
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    key-prefix: ${S3_KEY_PREFIX:}
